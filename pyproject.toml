[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beom-oss-analyzer"
version = "0.3.0"
description = "오픈소스 전수 분석·기능 포팅·원본 대비 검증 툴킷 (CLI · 에이전트 스킬 · MCP 서버)"
license = "LicenseRef-beom-oss-analyzer-use-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "multilspy>=0.1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["PySide6-Essentials>=6.12", "PySide6-Addons>=6.12", "PySide6-WebEngine>=6.12"]

[project.scripts]
oss-analyzer-mcp = "oss_analyzer.main:main"
oss-analyzer = "oss_analyzer.cli:main"

[project.gui-scripts]
beom-oss-analyzer = "oss_analyzer.app.main:main"
oss-analyzer-app = "oss_analyzer.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oss_analyzer.rulepacks" = ["*.yml"]
"oss_analyzer" = ["skills/*/*.md"]
"oss_analyzer.app" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
